<!doctype html>
<!-- Bron voor public/img/og.png (social preview, 1200×630). Bewust zonder portret van Michel.
     Opnieuw maken: zie README (tools/screenshot.sh og). -->
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Archivo';font-weight:400 900;font-stretch:75% 100%;src:url(../../public/fonts/archivo-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(../../public/fonts/plexmono-400-latin.woff2) format('woff2')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#EFEAE1;color:#17121F;font-family:Archivo,sans-serif}
.abs{position:absolute}
.vlak{left:640px;right:0;top:0;bottom:0;background:#E4DAF2}
.punten{left:600px;top:250px;width:200px;height:150px;background-image:radial-gradient(#5B2D91 1.7px,transparent 2px);background-size:16px 16px}
.zon{right:70px;top:60px;width:300px;height:300px;border-radius:50%;background:#844599}
.ring{right:310px;top:200px;width:96px;height:96px;border-radius:50%;border:2px solid #17121F;box-sizing:border-box}
.donker{left:640px;right:0;bottom:0;height:170px;background:#2A1B45}
.half{right:110px;bottom:170px;width:110px;height:110px;background:#C9B3EA}
.blok{left:700px;bottom:170px;width:150px;height:52px;background:#5B2D91}
.lijn{left:1010px;top:-20px;width:2px;height:760px;background:#17121F;transform-origin:50% 0;transform:rotate(28deg)}
.ster{left:900px;top:70px;width:30px;height:26px;background:#5B2D91;clip-path:polygon(50% 0,100% 100%,0 100%)}
.korrel{inset:0;background-image:url(../../public/img/korrel.webp);background-size:256px;mix-blend-mode:multiply}
.logo{left:64px;top:56px;height:52px;mix-blend-mode:multiply}
h1{position:absolute;left:60px;top:180px;margin:0;font-weight:900;font-stretch:78%;font-size:132px;line-height:.86;letter-spacing:-.02em;text-transform:uppercase}
h1 span{background:#844599;color:#fff;padding:0 .08em}
.sub{left:64px;bottom:56px;margin:0;font-family:'IBM Plex Mono',monospace;font-size:20px;text-transform:uppercase;letter-spacing:.06em;border-top:2px solid #17121F;padding-top:12px;width:520px}
.url{right:40px;bottom:40px;margin:0;font-family:'IBM Plex Mono',monospace;font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:#E4DAF2}
</style>
</head>
<body>
<div class="abs vlak"></div>
<div class="abs punten"></div>
<div class="abs zon"></div>
<div class="abs ring"></div>
<div class="abs donker"></div>
<div class="abs half"></div>
<div class="abs blok"></div>
<div class="abs lijn"></div>
<div class="abs ster"></div>
<div class="abs korrel"></div>
<img class="abs logo" src="../../public/img/logo.png" alt="">
<h1>Van finance<br>naar <span>data.</span></h1>
<p class="abs sub">Data engineering · BI · AI</p>
<p class="abs url">sitau5d.nl</p>
</body>
</html>
